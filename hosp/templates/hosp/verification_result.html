{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Verification - CureWell Hospital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #475569;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }
    /* Ambient Blur Blobs in background */
    .ambient-blob-1 {
      position: absolute;
      top: -10%;
      left: -10%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.06) 0%, rgba(14, 165, 233, 0) 70%);
      pointer-events: none;
      z-index: -1;
    }
    .ambient-blob-2 {
      position: absolute;
      top: 40%;
      right: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(20, 184, 166, 0.05) 0%, rgba(20, 184, 166, 0) 70%);
      pointer-events: none;
      z-index: -1;
    }
    .result-card {
      background: var(--card-bg) !important;
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border) !important;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04) !important;
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
      padding: 3rem 2.5rem;
      text-align: center;
      margin: 1rem;
    }
    .icon-container {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem auto;
    }
    .icon-success {
      background-color: #d1fae5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }
    .icon-error {
      background-color: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
    .btn-login {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: white;
      border: none;
      border-radius: 30px;
      padding: 0.75rem 2.2rem;
      font-weight: 600;
      transition: all 0.2s ease;
      text-decoration: none;
      display: inline-block;
      margin-top: 1.5rem;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2) !important;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #0369a1 0%, #0284c7 100%) !important;
      box-shadow: 0 6px 18px rgba(2, 132, 199, 0.3) !important;
      transform: translateY(-2px);
      color: white;
    }
    .btn-outline-secondary {
      border: 1px solid #cbd5e1 !important;
      color: var(--text-main) !important;
      background: transparent !important;
      border-radius: 30px !important;
      padding: 0.6rem 1.8rem !important;
      transition: all 0.2s ease;
    }
    .btn-outline-secondary:hover {
      background: #f1f5f9 !important;
      border-color: #cbd5e1 !important;
      color: #0f172a !important;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <!-- Ambient blur blobs for unique premium background aesthetic -->
  <div class="ambient-blob-1"></div>
  <div class="ambient-blob-2"></div>

  <div class="result-card">
    {% if success %}
      <div class="icon-container icon-success">
        <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"></path>
        </svg>
      </div>
      <h3 class="fw-bold text-success mb-3">Verification Successful</h3>
      <p class="text-secondary" style="color: var(--text-muted) !important;">{{ message }}</p>
      <a href="/patient_login/" class="btn-login">Go to Login</a>
    {% else %}
      <div class="icon-container icon-error">
        <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </div>
      <h3 class="fw-bold text-danger mb-3">Verification Failed</h3>
      <p class="text-secondary" style="color: var(--text-muted) !important;">{{ message }}</p>
      <a href="/patient_login/?action=signup" class="btn btn-outline-secondary mt-3">Try Registering Again</a>
    {% endif %}
  </div>

</body>
</html>
